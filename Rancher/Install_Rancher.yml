---
- name: Setup Rancher on master node
  hosts: master  
  become: true  

  tasks:
    - name: Install required packages for Python and pip
      apt:
        name:
          - python3-pip
          - curl
          - tar
        state: present
      when: inventory_hostname == 'k8s-master'

    - name: Install Docker SDK for Python
      pip:
        name: docker
        state: present
      when: inventory_hostname == 'k8s-master'

    - name: Pull Rancher specific image
      docker_image:
        name: "rancher/rancher"
        tag: "v2.8.3"
        source: pull
      when: inventory_hostname == 'k8s-master'

    - name: Install Rancher
      shell: |
        docker run -d --restart=unless-stopped   -p 80:80 -p 443:443   --privileged   rancher/rancher:v2.8.3
      args:
        creates: /opt/rancher
      when: inventory_hostname == 'k8s-master'

    - name: Enable UFW
      command: ufw --force enable
      register: ufw_enabled
      changed_when: "'Firewall is active' in ufw_enabled.stdout"

    - name: Allow Rancher management port 80
      command: ufw allow 80
      when: ufw_enabled.changed

    - name: Allow Rancher management port 443
      command: ufw allow 443
      when: ufw_enabled.changed

    - name: Reload UFW to apply new rules
      command: ufw reload
      when: ufw_enabled.changed
